name: Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main-android]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  MIN_SDK_VERSION: 24
  TARGET_SDK_VERSION: 35
  ENABLE_DEVICE_CALL_LOG: false
  RELEASE_BASENAME: who-called

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Bump Android version
        if: github.ref == 'refs/heads/main-android'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/bump-android-version.js
          VERSION_CODE=$(node -p "require('./android-version.json').versionCode")
          git add android-version.json
          git diff --cached --quiet || git commit -m "chore: bump Android versionCode to $VERSION_CODE [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Build Angular application
        run: npm run build -- --configuration=production

      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply Android versions and SDK levels
        working-directory: android/app
        run: |
          VERSION_CODE=$(node -p "require('../../android-version.json').versionCode")
          VERSION_NAME=$(node -p "require('../../android-version.json').versionName")
          sed -i 's/versionCode [0-9]*/versionCode project.hasProperty("versionCode") ? project.versionCode.toInteger() : 1/' build.gradle
          sed -i 's/versionName "[^"]*"/versionName project.hasProperty("versionName") ? project.versionName : "0.1.0"/' build.gradle
          sed -i "s/minSdkVersion = .*/minSdkVersion = $MIN_SDK_VERSION/" ../variables.gradle
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = $TARGET_SDK_VERSION/" ../variables.gradle
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_FILE=${RELEASE_BASENAME}-${VERSION_NAME//./-}" >> "$GITHUB_ENV"

      - name: Generate branded launcher and store icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          declare -A SIZES=([mipmap-mdpi]=48 [mipmap-hdpi]=72 [mipmap-xhdpi]=96 [mipmap-xxhdpi]=144 [mipmap-xxxhdpi]=192)
          for DIR in "${!SIZES[@]}"; do
            SIZE=${SIZES[$DIR]}
            ICON_SIZE=$((SIZE * 64 / 100))
            mkdir -p "android/app/src/main/res/$DIR"
            convert public/who-called.png -background none -resize "${ICON_SIZE}x${ICON_SIZE}" -gravity center -extent "${SIZE}x${SIZE}" "android/app/src/main/res/$DIR/ic_launcher.png"
            cp "android/app/src/main/res/$DIR/ic_launcher.png" "android/app/src/main/res/$DIR/ic_launcher_round.png"
            cp "android/app/src/main/res/$DIR/ic_launcher.png" "android/app/src/main/res/$DIR/ic_launcher_foreground.png"
          done
          mkdir -p releases
          convert public/who-called.png -background none -resize 420x420 -gravity center -extent 512x512 releases/playstore-icon.png

      - name: Patch native Android shell
        run: node scripts/patch-android.mjs

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        run: ./gradlew assembleDebug -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Build release APK and AAB
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks

      - name: Sign and verify release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p releases
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          UNSIGNED_APK=$(find android/app/build -name '*-release-unsigned.apk' | head -1)
          "$BUILD_TOOLS/zipalign" -v 4 "$UNSIGNED_APK" "releases/${RELEASE_FILE}.apk"
          "$BUILD_TOOLS/apksigner" sign --ks android/app/release-keystore.jks --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD "releases/${RELEASE_FILE}.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "releases/${RELEASE_FILE}.apk"
          UNSIGNED_AAB=$(find android/app/build -name '*-release.aab' | head -1)
          jarsigner -keystore android/app/release-keystore.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -signedjar "releases/${RELEASE_FILE}.aab" "$UNSIGNED_AAB" "$KEY_ALIAS"
          jarsigner -verify "releases/${RELEASE_FILE}.aab"

      - name: Collect debug artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/who-called-debug.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: who-called-android-${{ github.run_number }}
          path: |
            releases/*.apk
            releases/*.aab
            releases/playstore-icon.png
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/*.apk
            releases/*.aab
            releases/playstore-icon.png

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/release-keystore.jks
